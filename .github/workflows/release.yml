name: Release Roost

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build GitHub release artifacts
        run: ./script/package_github_release.sh

      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roost-release
          path: |
            dist/Roost.app.zip
            dist/Roost.app.zip.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: |
            Roost alpha build for tester downloads.

            Includes:
            - Roost.app.zip
            - Roost.app.zip.sha256

            Note: this build may be unsigned, so macOS Gatekeeper warnings are expected for external testers.
          files: |
            dist/Roost.app.zip
            dist/Roost.app.zip.sha256
